<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      color: #222;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 24px;
      color: #111;
    }

    .add-row {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .add-row input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
    }

    .add-row input:focus { border-color: #555; }

    .add-row button {
      padding: 10px 18px;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    .add-row button:hover { background: #333; }

    #task-list { display: flex; flex-direction: column; gap: 8px; }

    .task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 10px;
      padding: 12px 14px;
      transition: opacity 0.2s;
    }

    .task-item.done { opacity: 0.55; }

    .task-item input[type="checkbox"] {
      width: 17px;
      height: 17px;
      cursor: pointer;
      accent-color: #111;
      flex-shrink: 0;
    }

    .task-title {
      flex: 1;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .task-item.done .task-title {
      text-decoration: line-through;
      color: #999;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #bbb;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      line-height: 1;
      transition: color 0.15s;
      flex-shrink: 0;
    }

    .delete-btn:hover { color: #e53e3e; }

    .empty {
      text-align: center;
      color: #aaa;
      font-size: 0.9rem;
      padding: 32px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Task Manager</h1>
    <div class="add-row">
      <input type="text" id="new-task" placeholder="Add a new task…" />
      <button id="add-btn">Add</button>
    </div>
    <div id="task-list"></div>
  </div>

  <script>
    const list = document.getElementById('task-list');
    const input = document.getElementById('new-task');
    const addBtn = document.getElementById('add-btn');

    async function fetchTasks() {
      const res = await fetch('/tasks');
      const tasks = await res.json();
      render(tasks);
    }

    function render(tasks) {
      list.innerHTML = '';
      if (tasks.length === 0) {
        list.innerHTML = '<p class="empty">No tasks yet. Add one above!</p>';
        return;
      }
      tasks.forEach(task => {
        const item = document.createElement('div');
        item.className = 'task-item' + (task.done ? ' done' : '');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = task.done;
        checkbox.disabled = task.done;
        checkbox.addEventListener('change', () => markDone(task.id));

        const title = document.createElement('span');
        title.className = 'task-title';
        title.textContent = task.title;

        const del = document.createElement('button');
        del.className = 'delete-btn';
        del.textContent = '✕';
        del.title = 'Delete';
        del.addEventListener('click', () => removeTask(task.id));

        item.append(checkbox, title, del);
        list.appendChild(item);
      });
    }

    async function addTask() {
      const title = input.value.trim();
      if (!title) return;
      await fetch('/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title }),
      });
      input.value = '';
      fetchTasks();
    }

    async function markDone(id) {
      await fetch(`/tasks/${id}`, { method: 'PATCH' });
      fetchTasks();
    }

    async function removeTask(id) {
      await fetch(`/tasks/${id}`, { method: 'DELETE' });
      fetchTasks();
    }

    addBtn.addEventListener('click', addTask);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });

    fetchTasks();
  </script>
</body>
</html>
